# Gate XN2 amendment: SGMSE+ extension for H_P_final. Committed BEFORE any further SGMSE+ file is enhanced.
# Written 21 Oct 2026, after the XN2 report (results/xcorpus/report2/report.md, commit before this one).
#
# Already seen when this was written:
#   - H_P_final SGMSE+ on 25 complete paired base rows (178 outputs, base rows 0-25 in ext-prep order):
#     H_P1 delta -0.248, H_P2 delta -0.03, verdict 'underpowered' (rule needs >= 40)
#   - SGMSE+ per-condition medians on those rows (report2/sgmse_by_cond.csv)
#   - every other XN2 result, DFN3 H_P_final ('model_trait', 400 rows)
#
# Why this is an amendment: gate_overnight2.yaml said H_P_final is "computed once, at the end of this run".
# The run ended with SGMSE+ below the 40-row minimum. Extending to a FIXED count, chosen now and not
# after looking at new rows, avoids optional stopping.

provenance:
  committed_at: "2026-10-21"
  parent_gate: "configs/gate_overnight2.yaml (gate XN2), H_P_final"
  code: "src/xcorpus.py ext-score --models (score SGMSE+ only), run_finish.ps1"

sgmse_extension:
  inputs: "unchanged ext-prep list ..\\sgmse\\xc_sg_in (base row by base row: dem_A, dem_H, marven, deepship_ship, mbari_storm, mbari_dry, then one VB-DMD file)"
  stop: "exactly 40 complete paired base rows = the first 280 files of the ordered list (base ranks 0-4 x 8 SNRs, 5 base rows per SNR)"
  no_further_extension: "the verdict on these 40 rows is final for SGMSE+, whatever it is"
  model: "SGMSE+ ckpt\\SB_16k.pt, same settings as gates XN / XN2"

rule:   # unchanged from gate XN / XN2
  unit: "complete paired base rows (all six PAIRED conditions present)"
  H_P1: "median d_g on unseen marine (marven, deepship_ship, mbari_storm, mbari_dry) minus median on heard (dem_A, dem_H)"
  H_P2: "same on nr_g"
  verdict: "|delta| >= 0.20 shifts_with_novelty; |delta| < 0.10 model_trait; else inconclusive"
  descriptive: "same deltas on sisdr_gain and sisdr_hp100 gain; VB-DMD rows descriptive only"

report: "results/xcorpus/report2/report.md (regenerated by src.xn2) and extra.md (src.xn2_extra)"
