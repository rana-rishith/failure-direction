# Stage 1 — cross-condition training and evaluation.
# 4 models x 2 folds (train-weather / train-vessel) x 3 seeds = 24 runs.
defaults: base.yaml

models: [mask_stft, causal_gru, passthrough, diffusion_external]
folds: [fold_train-weather, fold_train-vessel]
seeds: [1337, 2024, 31415]

train:
  crop_s: 4.0
  batch_size: 16          # RTX 3060 12 GB, mask_stft. Halve for anything larger.
  max_steps: 60000
  lr: 3.0e-4
  grad_clip: 5.0
  amp: true
  # Equal compute budget: every model gets the same max_steps and the same
  # wall-clock ceiling. Log both. A baseline that "loses" on unequal compute
  # proves nothing.
  wallclock_ceiling_h: 8

eval:
  metrics: [pesq, stoi, si_sdr, wer]
  asr_model: small        # whisper-large is a rented-GPU job, not a local one
  oracle_floor: true
