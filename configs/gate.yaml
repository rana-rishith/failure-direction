# Pre-committed go/no-go gates for the direction index.
#
# Thresholds were fixed before results were seen. The OPERATIONALISATIONS of G1
# and G2 (the index formula, and what "mean magnitude" means) were not specified
# in the original file and were filled in after Claims 1 and 2 had been
# observed. That is disclosed in the paper and recorded here so the disclosure
# cannot be lost.

sign_convention: "dir_idx = (r_over - r_under) / (r_over + r_under + eps); positive = over-suppression dominant"
eps: 1.0e-8

# ceiling is inert for B1/B3 (sigmoid => M <= 1). For B2 or any generative model
# M can exceed 1, `under` ranges to 4 while `over` caps at 1, and the direction
# index acquires a positive bias. B2-only asymmetry.
ceiling: 2.0

G1:
  name: direction spread across the five noise types
  statistic: max-min of per-noise-type mean dir_idx
  threshold: 0.30
  pre_committed: true
  operationalised_after_results: true

G2:
  name: magnitude gap, unseen minus matched
  statistic: r_over + r_under, direction-agnostic; median is primary
  threshold: 0.10
  pre_committed: true
  operationalised_after_results: true

G3:
  name: WER asymmetry, over-suppressed minus under-suppressed
  statistic: mean WER difference between direction-extreme groups
  threshold: 0.05
  pre_committed: true
  operationalised_after_results: false

  # if the fraction of rows whose direction matches their condition exceeds
  # this, no within-condition direction contrast exists and G3 is untestable
  max_collinearity: 0.95

confound:
  model: b3
  steps: 20000
  metric: si_sdr_improvement   # per-utterance out-in; median per SNR, then mean over SNR strata
  note: one ~20-30 s source per noise type; type and recording are confounded; offset split impossible
  loto:                        # train on 2 weather types, test on the 3rd
    family_level: 0.5          # R >= 0.5 in all 3 held-outs -> Claim 1 is family-level
    type_level: 0.2            # R <= 0.2 in all 3 -> recording-level failure; reframe Claim 1
                               # anything else -> report as partial, no framing claim
segment:                       # disjoint-segment control, src/segment.py
  model: b3                    # primary; b1 repeat is optional
  steps: 20000
  window_sec: 3.0              # train crop and eval window (lightning half-loop = 3.79 s)
  note: recording timeline split in half; seg model hears half A only; eval on 3 s windows of test_matched whose noise lies wholly in A or wholly in B
  statistic: R_seg = score(seg on B) / score(full on B); score = median SI-SDR improvement per SNR, mean over SNR
  sanity_S_A: 0.8              # score(seg on A) / score(full on A) below this -> inconclusive
  recording_level: 0.8         # R_seg >= 0.8 -> matched performance is not sample replay
  sample_level: 0.5            # R_seg <= 0.5 -> matched performance is mostly replay of heard samples
                               # anything else -> partial, report, no framing claim
